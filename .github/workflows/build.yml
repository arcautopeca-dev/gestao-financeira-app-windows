name: Build Windows installer
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Build
        shell: bash
        run: |
          set +e
          npm run dist > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::$(grep -i -E 'error|cannot|failed|not found' build.log | head -8 | tr '\n' ' ' | cut -c1-900)"
            tail -25 build.log
            exit 1
          fi
          cat build.log | tail -15
      - uses: actions/upload-artifact@v4
        with: { name: instalador-windows, path: dist/*.exe }
      - name: Publicar na aba Releases
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "instalador-v${{ github.run_number }}" dist/*.exe --title "Instalador Gestão Financeira (build ${{ github.run_number }})" --notes "Baixe o arquivo .exe abaixo e dê dois cliques para instalar."
