name: Build Windows installer
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Build
        shell: bash
        run: |
          set +e
          npm run dist > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::$(grep -i -E 'error|cannot|failed|not found' build.log | head -8 | tr '\n' ' ' | cut -c1-900)"
            tail -25 build.log
            exit 1
          fi
          cat build.log | tail -15
      - uses: actions/upload-artifact@v4
        with: { name: instalador-windows, path: dist/*.exe }
